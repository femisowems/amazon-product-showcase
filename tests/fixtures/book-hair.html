back. I continue to visit Nicolette for hair removal in other areas – eyebrows, sidelocks.</span></p></div></div></div></div><div class="a-reactive-container-gradient"></div></div></div><div data-csa-c-slot-id="customer_review-R30RY9OC0I7VYA_1_show_more" data-csa-c-type="element" data-hook="reviewExpandButtonContainer" class="a-cardui-footer _Y3Itd_no-padding_1A9ha"><div class="a-cardui-expand-control-footer _Y3Itd_read-more-less_2uDYd" data-csa-c-type="widget" data-csa-interaction-events="click"><a href="javascript:void(0)" class="a-cardui-expand-control-footer-button" role="button"><span class="a-expander-icon"><i class="a-css-icon"></i></span><span class="a-see-more a-color-link"><span class="a-see-more-text" style="display:none">Read more</span><span class="a-see-less-text" style="display:none">Read less</span></span></a></div></div></div></div><div data-hook="translationSpinner" class="_Y3Itd_single-review-translation-spinner-container_ypxf2"><div class="a-spinner-wrapper _Y3Itd_single-review-translation-spinner_1tBUJ"><span class="a-spinner a-spinner-medium"></span></div></div></div><div class="a-section a-spacing-small a-spacing-top-small"><div class="_Y3Itd_single-review-vote-action-bar_10AyR"><div data-hook="helpfulVoteWidget" class="a-section a-spacing-none _Y3Itd_cr-voting-section_1cNTp"><div class="_Y3Itd_cr-helpful-button_1u3UK cr-vote-component" data-hook="helpfulVoteButton" data-mix-operations="HelpfulVoteClickHandler" data-asin="B09LF9HNZT" data-id="R30RY9OC0I7VYA" data-review-element-id="R30RY9OC0I7VYA" data-return-to="DpReview" data-sign-in-url="" data-csa-c-type="element" data-csa-c-slot-id="customer_review-R30RY9OC0I7VYA_1_helpful_button"><span class="a-button a-button-base"><span class="a-button-inner"><input type="submit" class="a-button-input"/><span class="a-button-text" aria-hidden="true"><div class="_Y3Itd_cr-helpful-text-desktop_2dXQG">Helpful</div></span></span></span></div><span data-hook="helpfulVoteLoadingMessage" class="_Y3Itd_hidden_
